<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mayabir Chat - Powered by Shivam Brahman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= SECTION 1: SPLASH SCREEN ================= -->
    <div id="splashScreen">
        <div class="splash-logo-box">M</div>
        <div class="splash-title">MAYABIR CHART</div>
    </div>

    <!-- ================= SECTION 2: SIDEBAR DRAWER & NAVIGATION ================= -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar-drawer" id="sidebarDrawer">
        <div class="sidebar-header">
            <h3>Mayabir Menu</h3>
            <button class="close-drawer-btn" id="closeDrawer">&times;</button>
        </div>
        
        <button class="new-chat-drawer-btn" id="newChatBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            New chat
        </button>

        <div class="sidebar-search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchChatsInput" placeholder="Search chats...">
        </div>

        <div class="sidebar-section-title">Recent History</div>
        <div class="chat-sessions-list" id="chatSessionsList"></div>
    </div>

    <!-- ================= SECTION 3: MAIN CHAT INTERFACE ================= -->
    <div class="aura-container" id="auraContainer">
        <div class="aura-header">
            <div class="header-left">
                <button class="menu-btn" id="menuBtn" title="Menu">
                    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <div class="brand-logo">M</div>
            </div>
            <h1>MAYABIR CHART</h1>
            <div style="width: 34px;"></div>
        </div>

        <div class="orb-container" id="orbSection">
            <div class="glowing-ring">
                <span class="inner-a">M</span>
            </div>
        </div>

        <div id="chatStream" class="chat-stream"></div>

        <!-- ================= SECTION 4: INPUT & SEARCH BAR ================= -->
        <div class="input-bar-container">
            <div class="glass-search-box">
                <input type="text" id="userInput" placeholder="Ask Mayabir Chat anything...">
                <button class="send-btn" id="sendBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
